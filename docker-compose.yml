services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ultra_test
      POSTGRES_USER: ultra
      POSTGRES_PASSWORD: ultra
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

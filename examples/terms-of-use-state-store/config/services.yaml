services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    Ultra\MappedTable\InMemoryRowDatabase: ~

    Ultra\MappedTable\MappedTableAdapter:
        class: Ultra\MappedTable\InMemoryMappedTableAdapter

    Ultra\UnitOfWork\TransactionManager:
        alias: Ultra\MappedTable\InMemoryRowDatabase

# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.faculty_id: 'faculty'
    app.default_faculty_event_store_table_prefix: 'faculty_'
    app.faculty_event_store_table_prefix: '%env(default:app.default_faculty_event_store_table_prefix:FACULTY_EVENT_STORE_TABLE_PREFIX)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    Ultra\EventStore\EventStore:
        factory: ['@App\Faculty\Infrastructure\EventStore\FacultyEventStoreFactory', 'create']

    Ultra\Projection\Bundle\ProjectionImplementationInterface:
        class: Ultra\Projection\InMemory\InMemoryProjectionImplementation

    App\Faculty\Infrastructure\EventStore\FacultyEventStoreFactory:
        arguments:
            $tablePrefix: '%app.faculty_event_store_table_prefix%'

    Ultra\UnitOfWork\TransactionManager:
        alias: App\Faculty\Infrastructure\DoctrineTransactionManager

    test.queue_worker:
        alias: Ultra\MessageHandling\Async\QueueWorker
        public: true

    App\Faculty\Infrastructure\EventStore\FacultyEventStoreSchemaCreateCommand:
        arguments:
            $tablePrefix: '%app.faculty_event_store_table_prefix%'

    App\Faculty\Infrastructure\Notification\NotificationService:
        alias: App\Faculty\Infrastructure\Notification\RecordingNotificationService

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
